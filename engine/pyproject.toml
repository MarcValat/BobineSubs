[project]
name = "syncsubtitles"
version = "2.0.0"
description = "Recale une piste de sous-titres sur les sous-titres de référence d'un MKV (décalage, dérive, sauts)"
readme = "README.md"
authors = [
    { name = "Marc Valat", email = "marc.valat@hotmail.fr" }
]
requires-python = ">=3.14"
dependencies = [
    "click>=8.4.2",
    "fastapi>=0.115.0",
    "imageio-ffmpeg>=0.6.0",
    "numpy>=2.5.1",
    "uvicorn>=0.32.0",
    "websockets>=13.0",
]

[project.scripts]
syncsubtitles = "syncsubtitles.cli:main"

[build-system]
requires = ["uv_build>=0.11.32,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.27.0",
    "pyinstaller>=6.22.3",
    "pyinstaller-hooks-contrib>=2026.7",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.0",
]

[tool.ruff]
line-length = 120

# The rules checked, named: a newer ruff enabling more by default doesn't
# change what passes. Ruff's classic defaults (syntax, undefined names,
# unused imports and variables) and sorted imports.
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

# `uv run pytest --cov`: which lines of the engine its tests run.
[tool.coverage.run]
source = ["syncsubtitles"]

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.pytest.ini_options]
pythonpath = ["tests"]
